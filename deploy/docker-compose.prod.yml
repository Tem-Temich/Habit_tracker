services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
      DJANGO_DEBUG: 0
    depends_on:
      - db
      - redis
    command: ["bash", "scripts/web.sh"]
    volumes:
      - static_volume:/app/staticfiles

  celery:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
      DJANGO_DEBUG: 0
    depends_on:
      - db
      - redis
    command: ["bash", "scripts/celery-worker.sh"]

  celery-beat:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
      DJANGO_DEBUG: 0
    depends_on:
      - db
      - redis
    command: ["bash", "scripts/celery-beat.sh"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro

volumes:
  postgres_data:
  redis_data:
  static_volume:
