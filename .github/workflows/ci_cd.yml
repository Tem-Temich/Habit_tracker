name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE_FOR_TESTS: "1"
      DJANGO_SECRET_KEY: "ci-test-secret-key-should-be-long-enough-1234567890"
      DJANGO_DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Run tests
        run: poetry run pytest

  lint:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Run flake8
        run: poetry run flake8 .

  build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      USE_SQLITE_FOR_TESTS: "1"
      DJANGO_SECRET_KEY: "ci-build-secret-key-should-be-long-enough-1234567890"
      DJANGO_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Django production checks
        run: poetry run python manage.py check --deploy

      - name: Build static files
        run: poetry run python manage.py collectstatic --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch --all
            git reset --hard origin/main
            /bin/bash scripts/deploy.sh
